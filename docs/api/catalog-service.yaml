openapi: 3.0.3
info:
  title: Catalog Service API
  description: >
    Côté "Requête" (read) du CQRS. Projection en lecture seule alimentée exclusivement par les
    événements Kafka `restaurant.events` publiés par restaurant-service. Aucune écriture exposée.
  version: "1.0.0"
servers:
  - url: /v1/catalog
paths:
  /restaurants:
    get:
      summary: Rechercher des restaurants par localisation et/ou type de cuisine
      parameters:
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lng
          in: query
          schema: { type: number, format: double }
        - name: radiusKm
          in: query
          schema: { type: number, default: 5 }
        - name: cuisineType
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Liste des restaurants correspondant aux critères
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RestaurantView" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }

  /restaurants/{id}:
    get:
      summary: Détail d'un restaurant et de son menu complet (agrégation en un seul appel)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      summary: Rechercher un plat spécifique à travers tous les restaurants
      parameters:
        - name: dish
          in: query
          required: true
          schema: { type: string, example: "pizza margherita" }
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Résultats de recherche (plat + restaurant associé)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    restaurantId: { type: string, format: uuid }
                    restaurantName: { type: string }
                    menuItem: { $ref: "#/components/schemas/MenuItemView" }

components:
  responses:
    NotFound:
      description: Ressource introuvable dans la projection (peut être en cours de synchronisation)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RestaurantView:
      type: object
      description: Modèle dénormalisé, reconstruit par consommation de restaurant.events
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cuisineType: { type: string }
        location:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        isOpen: { type: boolean }
        menuItems:
          type: array
          items: { $ref: "#/components/schemas/MenuItemView" }
        lastSyncedAt:
          type: string
          format: date-time
          description: Horodatage du dernier événement appliqué à la projection

    MenuItemView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: number }
        available: { type: boolean }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
