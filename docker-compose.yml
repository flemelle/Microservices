version: "3.9"

networks:
  foodapp-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Broker evenementiel (mode KRaft, sans Zookeeper) - voir architecture.md §4 et ADR-0002.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    networks: [foodapp-net]
    ports:
      - "9094:9094" # acces depuis l'hote (ex. clients Kafka locaux), non utilise par les services conteneurises
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Console web de visualisation des topics/partitions/consumer groups (pratique pour la soutenance).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [foodapp-net]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: foodapp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Microservices metier
  # ---------------------------------------------------------------------------
  restaurant-service:
    build:
      context: ./src/RestaurantService
    container_name: restaurant-service
    networks: [foodapp-net]
    ports:
      - "8081:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  catalog-service:
    build:
      context: ./src/CatalogService
    container_name: catalog-service
    networks: [foodapp-net]
    ports:
      - "8082:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: ./src/PaymentService
    container_name: payment-service
    networks: [foodapp-net]
    ports:
      - "8084:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_FAILURE_RATE: "0.15"
    depends_on:
      kafka:
        condition: service_healthy

  delivery-service:
    build:
      context: ./src/DeliveryService
    container_name: delivery-service
    networks: [foodapp-net]
    ports:
      - "8085:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: ./src/OrderService
    container_name: order-service
    networks: [foodapp-net]
    ports:
      - "8083:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RESTAURANT_SERVICE_URL: http://restaurant-service:8080
    depends_on:
      kafka:
        condition: service_healthy
      restaurant-service:
        condition: service_started
      payment-service:
        condition: service_started
      delivery-service:
        condition: service_started

  notification-service:
    build:
      context: ./src/NotificationService
    container_name: notification-service
    networks: [foodapp-net]
    ports:
      - "8086:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API Gateway - point d'entree unique expose a l'hote (voir architecture.md §9 et ADR-0005).
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./src/ApiGateway
    container_name: api-gateway
    networks: [foodapp-net]
    ports:
      - "8080:8080"
    depends_on:
      - restaurant-service
      - catalog-service
      - order-service
      - payment-service
      - delivery-service
      - notification-service
